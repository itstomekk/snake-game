<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snake</title>
<style>
  :root {
    --bg: #0d1117;
    --board-bg: #161b22;
    --grid-line: #21262d;
    --snake-head: #7ee787;
    --snake-body: #3fb950;
    --food: #f85149;
    --text: #c9d1d9;
    --accent: #58a6ff;
    --panel: #161b22;
    --border: #30363d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    height: 100%;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 40px;
    min-height: 100vh;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 2rem;
    letter-spacing: 2px;
    color: var(--snake-head);
    text-shadow: 0 0 12px rgba(126, 231, 135, 0.4);
  }

  .subtitle {
    margin: 0 0 16px;
    color: #8b949e;
    font-size: 0.85rem;
  }

  .hud {
    display: flex;
    gap: 24px;
    margin-bottom: 12px;
    font-size: 1.1rem;
  }

  .hud .label {
    color: #8b949e;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
  }

  .hud .value {
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--accent);
  }

  #boardWrap {
    position: relative;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: var(--board-bg);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
    border-radius: 6px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(13, 17, 23, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }

  #overlay.hidden { display: none; }

  #overlay h2 {
    margin: 0 0 8px;
    color: var(--snake-head);
    font-size: 1.5rem;
  }

  #overlay p {
    margin: 4px 0 16px;
    color: #8b949e;
    font-size: 0.9rem;
    max-width: 260px;
  }

  button {
    background: var(--snake-body);
    color: #0d1117;
    border: none;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
  }

  button:hover { background: var(--snake-head); }
  button:active { transform: scale(0.96); }

  .controls-hint {
    margin-top: 14px;
    color: #6e7681;
    font-size: 0.8rem;
    text-align: center;
    max-width: 320px;
  }

  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 18px;
  }

  #dpad button {
    width: 56px;
    height: 56px;
    font-size: 1.4rem;
    padding: 0;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }

  #dpad button:active { background: var(--snake-body); color: #0d1117; }

  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  .spacer { visibility: hidden; }

  @media (min-width: 700px) {
    #dpad { display: none; }
  }

  footer {
    margin-top: 24px;
    color: #484f58;
    font-size: 0.75rem;
  }

  footer a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>

  <h1>🐍 SNAKE</h1>
  <p class="subtitle">Classic snake, right in your browser</p>

  <div class="hud">
    <div>
      <span class="label">Score</span>
      <span class="value" id="score">0</span>
    </div>
    <div>
      <span class="label">Best</span>
      <span class="value" id="best">0</span>
    </div>
  </div>

  <div id="boardWrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle">Ready?</h2>
      <p id="overlayText">Use arrow keys or WASD to move. Eat the red food, avoid walls and yourself.</p>
      <button id="startBtn">Start Game</button>
    </div>
  </div>

  <p class="controls-hint">Arrow keys / WASD to move &middot; Space to pause &middot; Enter to restart</p>

  <div id="dpad">
    <button class="up" data-dir="up">▲</button>
    <span class="spacer"></span>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>

  <footer>Built with vanilla JS &middot; <a href="https://github.com" target="_blank" rel="noopener">GitHub Pages</a></footer>

<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');

  const GRID_SIZE = 20;
  const CELL = canvas.width / GRID_SIZE;
  const BASE_SPEED_MS = 130;

  let snake, dir, nextDir, food, score, best, gameState, tickInterval, tickMs;

  best = Number(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function resetState() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    tickMs = BASE_SPEED_MS;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    let candidate;
    do {
      candidate = {
        x: Math.floor(Math.random() * GRID_SIZE),
        y: Math.floor(Math.random() * GRID_SIZE),
      };
    } while (snake.some(s => s.x === candidate.x && s.y === candidate.y));
    food = candidate;
  }

  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
    ctx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food');
    roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 4);
    ctx.fill();

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0
        ? getComputedStyle(document.documentElement).getPropertyValue('--snake-head')
        : getComputedStyle(document.documentElement).getPropertyValue('--snake-body');
      roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= GRID_SIZE ||
      head.y < 0 || head.y >= GRID_SIZE ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      if (tickMs > 60) {
        tickMs -= 3;
        restartTicker();
      }
    } else {
      snake.pop();
    }

    draw();
  }

  function restartTicker() {
    clearInterval(tickInterval);
    tickInterval = setInterval(step, tickMs);
  }

  function gameOver() {
    clearInterval(tickInterval);
    gameState = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Game Over';
    overlayText.textContent = `You scored ${score}. Press Enter or the button to try again.`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (gameState === 'playing') {
      clearInterval(tickInterval);
      gameState = 'paused';
      overlayTitle.textContent = 'Paused';
      overlayText.textContent = 'Press Space to resume.';
      startBtn.textContent = 'Resume';
      overlay.classList.remove('hidden');
    } else if (gameState === 'paused') {
      gameState = 'playing';
      overlay.classList.add('hidden');
      restartTicker();
    }
  }

  function startGame() {
    resetState();
    gameState = 'playing';
    overlay.classList.add('hidden');
    draw();
    restartTicker();
  }

  function setDirection(newDir) {
    if (gameState !== 'playing') return;
    if (newDir.x !== 0 && dir.x !== 0) return;
    if (newDir.y !== 0 && dir.y !== 0) return;
    if (newDir.x === -dir.x && newDir.y === -dir.y) return;
    nextDir = newDir;
  }

  const KEY_MAP = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', (e) => {
    if (KEY_MAP[e.key]) {
      e.preventDefault();
      setDirection(KEY_MAP[e.key]);
    } else if (e.key === ' ') {
      e.preventDefault();
      if (gameState === 'playing' || gameState === 'paused') togglePause();
    } else if (e.key === 'Enter') {
      if (gameState !== 'playing') startGame();
    }
  });

  document.querySelectorAll('#dpad button').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.dir;
      if (d === 'up') setDirection({ x: 0, y: -1 });
      if (d === 'down') setDirection({ x: 0, y: 1 });
      if (d === 'left') setDirection({ x: -1, y: 0 });
      if (d === 'right') setDirection({ x: 1, y: 0 });
    });
  });

  // Basic swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    } else {
      setDirection(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
    }
    touchStart = null;
  });

  startBtn.addEventListener('click', () => {
    if (gameState === 'paused') {
      togglePause();
    } else {
      startGame();
    }
  });

  resetState();
  draw();
})();
</script>
</body>
</html>
